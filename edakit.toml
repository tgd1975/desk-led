# edakit project file: the table of contents – the project, its boards and where their files are.
# Reference: edakit handbook/10-reference.md
#
# Desk LED: a coin cell, a push button and an LED – press the button and the LED lights. One board, sized to its
# parts. JLCPCB makes it and places the SMD parts on the top side (docs/decisions.md D-1).

[project]
name = "desk-led"                # EasyEDA project (friendly name), created once by hand
company = "Desk LED"             # schematic title block
quantity = 5                     # boards per order: the stock check (F-2) needs this many sets
distributors = ["lcsc", "reichelt", "rs"]   # the owner's suppliers, as in the Christmas bell
graph = "hardware/graph.toml"    # the single source of truth; graph.json beside it is generated
requirements = ["hardware/requirements.toml"]   # what the circuit must do (skill requirements)
parts = "hardware/parts"         # one JSON file per part
sim = "hardware/sim.json"        # simulation scenarios
schematic = "hardware/schematic.toml"   # arrangement of the schematic
signoff = "hardware/signoff.json"       # sign-offs, bound to the hashes of circuit and layout
artifacts = "build/edakit"       # caches, previews, routing files, exports (not versioned)
reports = "build/release"        # one folder per release-gate run

[boards.main]
title = "Desk LED"               # page name of the readable schematic
template = "generated_main"      # generated from the graph, replaced on every run
schematic = "layout_main"        # readable schematic; the PCB is linked to it
pcb = "main"                     # PCB document in EasyEDA
# file = "hardware/boards/main.toml" – the PCB designer starts it once the parts exist (size: fit to the parts)

[release]
assembly = { sides = ["top"], smd_only = true }   # JLCPCB Economic: one side, SMD only (D-1)

[cart]                           # as in the Christmas bell
ship_to = "Austria"
shipping = { jlcpcb = "DHL Express" }

[cost]                           # the estimate of edakit cost, no budget (D-1)
currency = "EUR"
rates = { USD = 0.8951 }         # ECB reference rate of 2026-10-30: 1 EUR = 1.1172 USD
vat_pct = 20                     # Austrian VAT on the order
